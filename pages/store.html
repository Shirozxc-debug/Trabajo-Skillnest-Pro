<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Jolt Store</title>
    <link rel="stylesheet" href="static/css/style.css">
    <!-- Iconos de FontAwesome para las categorías y botones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Encabezado / Barra de navegación -->
    <header class="header">
        <nav class="navbar">
            <div class="nav-left">
                <img src="static/images/gamejolt3.png" alt="logo">
                <a href="#" class="nav-link active">STORE</a>
                <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            </div>


            <div class="barra-busqueda">
                <input type="text" placeholder="Search">
            </div>

            <div class="nav-right">
                <button class="btn-outline">Get App</button>
                <a href="#" class="nav-text-link">Log in</a>
                <a href="#" class="nav-text-link">Sign up</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Banner superior -->
        <section class="sub-header">
            <p class="banner-text">Game Jolt's Store is an open platform to share your games with the world.</p>
            <button class="btn-primary">Add Your Game</button>
        </section>

        <!-- Sección Browse Games -->
        <section class="browse-section">
            <h2 class="section-title">Browse Games</h2>
            <div class="cards-carousel">
                <div class="card">
                    <i class="fa-solid fa-hand-fist card-icon"></i>
                    <span>#action</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-ghost card-icon"></i>
                    <span>#horror</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-mountain card-icon"></i>
                    <span>#adventure</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-gamepad card-icon"></i>
                    <span>#fangame</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-robot card-icon"></i>
                    <span>#fnaf</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-skull card-icon"></i>
                    <span>#undertale</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-mask card-icon"></i>
                    <span>#bendy</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-music card-icon"></i>
                    <span>#fnf</span>
                </div>
                <div class="card">
                    <i class="fa-solid fa-shield-halved card-icon"></i>
                    <span>#rpg</span>
                </div>
            </div>
        </section>

        <!-- Filtros y pestañas -->
        <section class="filter-section">
            <div class="tabs">
                <button class="tab active">Featured</button>
                <button class="tab">Hot</button>
                <button class="tab">Best</button>
                <button class="tab">New</button>
            </div>
            <div class="dropdown-filters">
                <button class="dropdown-btn">Price <i class="fa-solid fa-chevron-down"></i></button>
                <button class="dropdown-btn">OS <i class="fa-solid fa-chevron-down"></i></button>
                <button class="dropdown-btn">Browser <i class="fa-solid fa-chevron-down"></i></button>
                <button class="dropdown-btn">Maturity <i class="fa-solid fa-chevron-down"></i></button>
                <button class="dropdown-btn">Status <i class="fa-solid fa-chevron-down"></i></button>
                <button class="dropdown-btn">Partners <i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </section>
        <a href="../page/coso.html">
            <div>
                <img src="../page/static/images/img-fnaf-world.webp" alt="">
                <p>Scott Cawthon</p>
                <h3>FNaF World</h3>
            </div>
        </a>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
