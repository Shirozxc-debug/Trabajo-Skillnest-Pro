<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>placeholder</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <img src="../static/images/gamejolt3.png" alt="logo">
                <a href="../pages/store.html" class="nav-link">STORE</a>
                <button class="opciones">...</button>
            </div>
            <div class="barra-busqueda">
                <input type="text" placeholder="Search">
            </div>
            <div class="botones">
                <div>
                    <button class="button1">
                        Get App
                    </button>
                </div>
                <div>
                    <Button class="button2">
                        Log in
                    </Button>
                </div>
                <div>
                    <Button class="button2">
                        Sign up
                    </Button>
                </div>
            </div>
        </nav>
    </header>
    <main class="main">
        <div class="banner">
            <img src="static/images/img-fnaf-world.webp" alt="imagen de banner">
        </div>
        <div class="informacion">
            <div class="usuario">
                <img src="static/images/Animdudee.webp" alt="usuario">
                <div class="texto-usuario">
                    <h2>FnaF World</h2>
                    <p>By Scott Cawthon @realscawthon</p>
                    <div class="botones">
                        <button>Overview</button>
                        <button>Comments</button>
                        <button>Followers</button>
                        <button>...</button>
                    </div>
                </div>
                <div class="seguir">
                    <p>100.000</p>
                    <button class="verde">Follow</button>
                </div>
                <button class="playlist">+</button>
            </div>
        </div>
        <div class="carrusel">
            <img src="static/images/img-fnaf-1.webp" alt="imagen">
            <img src="static/images/img-fnaf-2.webp" alt="imagen">
            <img src="static/images/img-fnaf-3.webp" alt="imagen">
            <img src="static/images/img-fnaf-4.webp" alt="imagen">
        </div>
        <div class="descarga">
            <h2>FNaF World</h2>
            <p>Version: 0.1.24 -- Over 10 years ago</p>
            <button class="boton-descargas">Download <span>(330 MB)</span></button>
        </div>
    </main>
</body>
</html>
