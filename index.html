<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Jolt</title>
    <link rel="stylesheet" href="static/css/style.css">
    <!-- FontAwesome para el icono de tres puntos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- Encabezado / Barra de navegación -->
    <header class="header">
        <nav data-v-a7bda2d8="" id="shell-top-nav" class="navbar backdrop-affected">
            <div data-v-a7bda2d8="" class="navbar-left">
                <div data-v-a7bda2d8="" class="-col">
                    <img src="static/images/gamejolt3.png" alt="gamejolt">
                    
                    <a href="../pages/store.html" class="nav-store-link">STORE</a>

                    <div data-v-81b1a4aa="" data-v-a7bda2d8="" id="popper-8" class="popper">
                        <a data-v-81b1a4aa="" class="navbar-item"><span data-v-81b1a4aa="" class="jolticon jolticon-ellipsis-v"><i class="fa-solid fa-ellipsis-vertical"></i></span></a>
                    </div>
                </div>
            </div>

            <div data-v-a7bda2d8="" class="navbar-center">
                <div data-v-a7bda2d8="" class="-search">
                    <div data-v-483ae2b4="" data-v-a7bda2d8="" class="app-search">
                        <form data-v-483ae2b4="" class="navbar-form" action="/search" method="GET" role="search">
                            <div data-v-483ae2b4="" class="-input">
                                <label data-v-483ae2b4="" for="search-input-5" class="sr-only"><span data-v-483ae2b4="">Search</span></label>
                                <div data-v-483ae2b4="" id="popper-9" class="popper -block">
                                    <input data-v-483ae2b4="" type="search" class="search-input form-control" name="q" placeholder="Search" autocomplete="off" id="search-input-5" value="">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div data-v-a7bda2d8="" class="navbar-right">
                <div data-v-a7bda2d8="" class="-button">
                    <a class="button -outline" type="button">Get App</a>
                </div>
                <div data-v-a7bda2d8="" class="-col">
                    <ul data-v-a7bda2d8="" class="navbar-items">
                        <li data-v-a7bda2d8=""><a class="nav-text-link">Log in</a></li>
                        <li data-v-a7bda2d8=""><a class="nav-text-link">Sign up</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="main page-hero">
        <div class="container -container">
            <div class="-hero-wrapper">
                <h1 class="-hero-text -text-shadow">
                    Join a growing community of <br> creators and gamers from around <br> the world!
                </h1>
            </div>

            <div class="-auth-content">
                <div class="-desktop-island">
                    <div class="tarjeta">
                        <div>
                            <button class="google">
                                <img src="https://s.gjcdn.net/assets/BDeLUMOu.svg" alt="Google icon">
                                Sign up with Google
                            </button>
                        </div>

                        <div class="auth-line-thru">or</div>

                        <div class="placeholder">
                            <input class="color-placeholder" type="email" placeholder="Email">
                        </div>
                        <div class="placeholder">
                            <input class="color-placeholder" type="text" placeholder="Username">
                        </div>
                        <div class="placeholder">
                            <input class="color-placeholder" type="password" placeholder="Password">
                        </div>

                        <div>
                            <button class="verde">Sign up</button>
                        </div>

                        <div>
                            <p class="color-p">By signing up, you agree to the
                                <a class="color-a">Terms of Use</a> and
                                <a class="color-a">Privacy Policy</a>, including the
                                <a class="color-a">Cookie Policy</a>.
                            </p>
                        </div>

                        <div class="-trouble-text -text-shadow">
                            Already have an account <a class="color-a">Log in</a>
                        </div>
                    </div>
                </div>

                <div class="-app-buttons">
                    <div class="app-buttons -justified">
                        <a class="-button" href="https://app.gamejolt.com/x/deep/?ac=other&amp;link=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.gamejolt.app" target="_blank">
                            <img src="https://s.gjcdn.net/assets/8YcMO4AL.png" alt="Get it on Google Play">
                        </a>
                        <a class="-button" href="https://app.gamejolt.com/x/deep/?ac=other&amp;link=https%3A%2F%2Fapps.apple.com%2Fus%2Fapp%2Fgame-jolt-social%2Fid1546759412" target="_blank">
                            <img src="https://s.gjcdn.net/assets/D_HLfvzc.svg" alt="Download on the App Store">
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
